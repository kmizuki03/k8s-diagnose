# k8s-diagnose Go版 設定例
# ./k8s-diagnose.ini は自動で読み込まれます（--no-configで無効化）。
# `k8s-diagnose config`でも同じ設定と検証を使って編集できます。
# 空欄は組み込み既定値を使い、プリセット、CLI引数の順に優先されます。

[target]
namespace =
context =
kubeconfig =
timeout = 15
qps = 10
burst = 20
page_size = 500

[diagnosis]
mode = all
logs = false
unused = false
events_limit =
restart_threshold = 5
node_heartbeat_timeout = 180
watch =
workers = 4
log_signatures_file =
log_signature_lines =

[connection]
enabled = false
port =
path =

[debug]
enabled = false
image =
profile =

[display]
tail =
mask_secrets =
exit_zero = false
show_commands =
show_api_requests =

[report]
format = text
file =
save_snapshot =
diff =
baseline =
fail_on = issue
max_issues =

[history]
database =
window =
flap_threshold =
restart_growth =
retain =

[notification]
webhook_url_env =
format =
timeout =
