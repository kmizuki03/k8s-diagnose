name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - name: Install linters and security scanners
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub Actions workflow
        run: actionlint -color=false
      - name: Test, race, vet, RBAC drift, build and scan
        env:
          K8S_DIAGNOSE_REQUIRE_SECURITY_TOOLS: "1"
        run: ./scripts/run-ci-tests.sh
      - name: Install SBOM and license tools
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          go install github.com/google/go-licenses/v2@v2.0.1
      - name: Generate SBOM and third-party notices
        run: ./scripts/generate-supply-chain.sh
      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v7
        with:
          name: k8s-diagnose-supply-chain
          path: dist/supply-chain
          if-no-files-found: error
